server:
  port: 8080

spring:
  application:
    name: compra-direta-api

  datasource:
    url: jdbc:postgresql://localhost:5432/compra_direta
    username: compra_direta
    password: compra_direta
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:migration/database/master.xml

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    topology:
      exchange: compra-direta.exchange
      routing-key: compra-direta.publicada
      queue: compra-direta.publicada.notificacao.queue
      dlx: compra-direta.dlx
      dlq-routing-key: compra-direta.publicada.dlq
      dlq: compra-direta.publicada.notificacao.dlq
    listener:
      simple:
        default-requeue-rejected: false

  web:
    cors:
      allowed-origins: "*"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

