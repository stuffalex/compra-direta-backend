services:
  postgres:
    image: postgres:16-alpine
    container_name: compra-direta-desafio-postgres
    environment:
      POSTGRES_DB: compra_direta
      POSTGRES_USER: compra_direta
      POSTGRES_PASSWORD: compra_direta
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: compra-direta-desafio-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
